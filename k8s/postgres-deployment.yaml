apiVersion: apps/v1
kind: Deployment
metadata:
    name: postgres
    namespace: demo
spec:
    replicas: 1
    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres
        spec:
            containers:
            - name: postgres
              image: postgres:16
              ports:
              - containerPort: 5432
              env:
              - name: POSTGRES_DB
                value: jobtracker
              - name: POSTGRES_USER
                value: demo
              - name: POSTGRES_PASSWORD
                value: changeme
              volumeMounts:
              - name: postgres-data
                mountPath: /var/lib/postgresql/data
            volumes:
            - name: postgres-data
              emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
    name: postgres
    namespace: demo
spec:
    type: ClusterIP
    selector:
        app: postgres
    ports:
    - port: 5432
      targetPort: 5432